<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garden Gnome — Property Setup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f5ecd3;
  --paper-warm: #ebe0be;
  --paper-ivory: #faf3de;
  --cream: #fdf6e4;
  --forest: #3d4f2a;
  --forest-deep: #2a3820;
  --ivy: #556b3a;
  --moss: #7a8c5a;
  --terra: #b5552a;
  --terra-deep: #8b3e1d;
  --rust: #9e5436;
  --stone: #d0c49f;
  --stone-soft: #dfd3ad;
  --ink: #2e2a1f;
  --ink-soft: #6b5f45;
  --ink-muted: #8a7e62;
  --serif: 'Fraunces', 'Baskerville', Georgia, serif;
  --sans: 'DM Sans', -apple-system, sans-serif;
  --sun: rgba(244, 204, 95, 0.35);
  --partial: rgba(184, 171, 94, 0.35);
  --shade: rgba(85, 107, 58, 0.4);
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--serif);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

.app {
  max-width: 1100px;
  margin: 0 auto;
  min-height: 100vh;
}

/* HEADER */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 32px;
  border-bottom: 1px solid var(--stone);
}

.brand { display: flex; align-items: center; gap: 10px; }
.brand-icon { width: 32px; height: 38px; }

.brand-name {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 19px;
  color: var(--forest-deep);
  line-height: 1;
}

.brand-tag {
  font-family: var(--serif);
  font-style: italic;
  font-size: 11px;
  color: var(--terra);
}

.step-indicator {
  display: flex;
  align-items: center;
  gap: 16px;
  font-family: var(--serif);
  font-style: italic;
  font-size: 13px;
  color: var(--ink-soft);
}

.step-pills { display: flex; gap: 6px; }

.step-pill {
  width: 24px;
  height: 3px;
  background: var(--stone);
  border-radius: 2px;
}

.step-pill.on { background: var(--ivy); }
.step-pill.current { background: var(--terra); width: 36px; }

/* CONTENT */
.content { padding: 32px; }

.page-intro { margin-bottom: 24px; }

.eyebrow {
  font-family: var(--sans);
  font-size: 10px;
  letter-spacing: 0.22em;
  color: var(--terra);
  text-transform: uppercase;
  margin-bottom: 8px;
}

h1 {
  font-family: var(--serif);
  font-weight: 400;
  font-size: 34px;
  line-height: 1.1;
  letter-spacing: -0.015em;
  color: var(--forest-deep);
  margin: 0 0 6px;
}

h1 em { font-style: italic; color: var(--terra); font-weight: 400; }

.deck {
  font-family: var(--serif);
  font-size: 15px;
  color: var(--ink-soft);
  margin: 0;
  max-width: 620px;
  line-height: 1.55;
}

h2 {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 14px;
  font-style: italic;
  color: var(--forest);
  margin: 0 0 10px;
}

/* STEP 1: ADDRESS */
.address-block {
  max-width: 640px;
  padding: 24px;
  background: var(--paper-ivory);
  border: 1px solid var(--stone-soft);
  border-radius: 6px;
  margin-bottom: 20px;
}

.address-label {
  font-family: var(--serif);
  font-size: 14px;
  color: var(--forest);
  margin-bottom: 8px;
  font-style: italic;
}

.address-input {
  width: 100%;
  background: var(--cream);
  border: 1.5px solid var(--stone);
  border-radius: 4px;
  padding: 12px 14px;
  font-size: 16px;
  font-family: var(--serif);
  color: var(--forest-deep);
  outline: none;
}

.address-input:focus { border-color: var(--ivy); }

.address-help {
  font-family: var(--sans);
  font-size: 11px;
  color: var(--ink-muted);
  margin-top: 8px;
  letter-spacing: 0.03em;
}

.confirm-location {
  margin-top: 16px;
  padding: 14px 16px;
  background: var(--cream);
  border: 1px solid var(--stone-soft);
  border-radius: 4px;
  font-size: 14px;
  color: var(--forest-deep);
  line-height: 1.5;
}

.confirm-location strong {
  font-style: italic;
  font-weight: 500;
  color: var(--terra);
}

/* STEP 2: TRACE */
.map-layout {
  display: grid;
  grid-template-columns: 1fr 280px;
  gap: 18px;
}

.map-container {
  position: relative;
  aspect-ratio: 4 / 3;
  background: #2a3d20;
  background-image: url('https://images.unsplash.com/photo-1572021335469-31706a17aaef?w=1000&q=80&auto=format&fit=crop');
  background-size: cover;
  background-position: center;
  border-radius: 6px;
  border: 1.5px solid var(--stone);
  overflow: hidden;
  cursor: crosshair;
}

.map-overlay-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.map-hint {
  position: absolute;
  bottom: 12px;
  left: 12px;
  background: rgba(250, 243, 222, 0.95);
  color: var(--forest-deep);
  padding: 8px 14px;
  border-radius: 4px;
  font-family: var(--serif);
  font-style: italic;
  font-size: 13px;
  border: 1px solid var(--stone-soft);
  pointer-events: none;
}

.map-compass {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 44px;
  height: 44px;
  background: rgba(250, 243, 222, 0.9);
  border: 1px solid var(--stone);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--serif);
  font-weight: 500;
  font-size: 13px;
  color: var(--forest-deep);
  pointer-events: none;
}

.map-scale {
  position: absolute;
  bottom: 12px;
  right: 12px;
  background: rgba(250, 243, 222, 0.9);
  padding: 4px 10px;
  font-family: var(--sans);
  font-size: 10px;
  color: var(--ink-soft);
  border: 1px solid var(--stone-soft);
  letter-spacing: 0.05em;
}

.tools-panel {
  background: var(--paper-ivory);
  border: 1px solid var(--stone-soft);
  border-radius: 6px;
  padding: 14px 16px;
  height: fit-content;
}

.tool-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 16px;
}

.tool-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  background: var(--cream);
  border: 1px solid var(--stone-soft);
  border-radius: 4px;
  font-family: var(--serif);
  font-size: 13px;
  color: var(--forest-deep);
  cursor: pointer;
  text-align: left;
  transition: all 0.15s;
}

.tool-btn:hover { border-color: var(--ivy); background: var(--paper-ivory); }
.tool-btn.active { border-color: var(--terra); background: var(--paper-warm); }

.tool-icon {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}

.tool-label { flex: 1; }

.tool-count {
  font-family: var(--serif);
  font-style: italic;
  font-size: 11px;
  color: var(--terra);
}

.placed-list {
  padding-top: 14px;
  border-top: 1px dashed var(--stone);
  font-family: var(--serif);
  font-size: 12px;
  color: var(--ink-soft);
}

.placed-list-title {
  font-family: var(--serif);
  font-style: italic;
  font-size: 12px;
  color: var(--terra);
  margin-bottom: 8px;
}

.placed-item {
  display: flex;
  justify-content: space-between;
  padding: 4px 0;
  font-size: 12.5px;
  color: var(--forest-deep);
}

.placed-item em { font-style: italic; color: var(--ink-muted); font-size: 11px; }

/* STEP 3: FILL IN GAPS */
.gaps-form {
  max-width: 720px;
  display: grid;
  gap: 20px;
}

.gaps-section {
  padding: 18px 20px;
  background: var(--paper-ivory);
  border: 1px solid var(--stone-soft);
  border-radius: 6px;
}

.gaps-question {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 15px;
  color: var(--forest-deep);
  margin-bottom: 4px;
}

.gaps-sublabel {
  font-family: var(--serif);
  font-style: italic;
  font-size: 12.5px;
  color: var(--ink-muted);
  margin-bottom: 12px;
}

.chip-group {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.chip-opt {
  display: inline-flex;
  align-items: center;
  padding: 7px 14px;
  background: var(--cream);
  color: var(--forest-deep);
  border: 1px solid var(--stone);
  border-radius: 999px;
  font-family: var(--serif);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
}

.chip-opt:hover { border-color: var(--ivy); }
.chip-opt.active {
  background: var(--ivy);
  color: var(--cream);
  border-color: var(--ivy);
}

.textarea-simple {
  width: 100%;
  background: var(--cream);
  border: 1px solid var(--stone);
  border-radius: 4px;
  padding: 10px 12px;
  font-family: var(--serif);
  font-size: 14px;
  color: var(--forest-deep);
  resize: vertical;
  min-height: 60px;
  outline: none;
}

.textarea-simple:focus { border-color: var(--ivy); }

/* STEP 4: ANALYSIS */
.analysis-grid {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 22px;
  margin-bottom: 22px;
}

.map-annotated {
  position: relative;
  aspect-ratio: 4 / 3;
  background: #2a3d20;
  background-image: url('https://images.unsplash.com/photo-1572021335469-31706a17aaef?w=1000&q=80&auto=format&fit=crop');
  background-size: cover;
  background-position: center;
  border-radius: 6px;
  border: 1.5px solid var(--stone);
  overflow: hidden;
}

.pin {
  position: absolute;
  transform: translate(-50%, -100%);
  cursor: pointer;
  z-index: 2;
}

.pin-marker {
  width: 24px;
  height: 24px;
  background: var(--terra);
  border: 2px solid var(--cream);
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
  box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: var(--cream);
  font-weight: 500;
}

.pin-marker.info { background: var(--ivy); }

.pin-label {
  position: absolute;
  top: 28px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(250, 243, 222, 0.95);
  color: var(--forest-deep);
  padding: 4px 10px;
  border-radius: 3px;
  font-family: var(--serif);
  font-size: 11px;
  white-space: nowrap;
  border: 1px solid var(--stone-soft);
  line-height: 1.2;
}

.pin-label em { font-style: italic; color: var(--terra); font-size: 10px; display: block; }

.sun-zone {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
}

.panel {
  background: var(--paper-ivory);
  border: 1px solid var(--stone-soft);
  border-radius: 6px;
  padding: 18px 20px;
}

.panel-title {
  font-family: var(--serif);
  font-style: italic;
  font-size: 14px;
  color: var(--terra);
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px dashed var(--stone);
}

.inventory {
  display: grid;
  gap: 10px;
}

.inv-row {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 6px 0;
  font-family: var(--serif);
  font-size: 13px;
  color: var(--forest-deep);
  border-bottom: 1px dotted var(--stone-soft);
}

.inv-row:last-child { border-bottom: none; }

.inv-label { color: var(--ink-soft); font-style: italic; }
.inv-value { font-weight: 500; text-align: right; }

/* DIGEST */
.digest {
  grid-column: 1 / -1;
  padding: 28px 32px;
  background: var(--paper-ivory);
  border: 1px solid var(--stone-soft);
  border-left: 4px solid var(--ivy);
  border-radius: 6px;
  margin-bottom: 22px;
}

.digest-header {
  display: grid;
  grid-template-columns: 56px 1fr;
  gap: 16px;
  align-items: start;
  margin-bottom: 18px;
}

.digest-avatar { width: 56px; height: 66px; }

.digest-label {
  font-family: var(--sans);
  font-size: 10px;
  letter-spacing: 0.22em;
  color: var(--terra);
  text-transform: uppercase;
  margin-bottom: 4px;
}

.digest-title {
  font-family: var(--serif);
  font-weight: 400;
  font-size: 22px;
  line-height: 1.2;
  color: var(--forest-deep);
  margin: 0;
  letter-spacing: -0.01em;
}

.digest-title em { font-style: italic; color: var(--terra); }

.digest-body {
  font-family: var(--serif);
  font-size: 15.5px;
  line-height: 1.65;
  color: var(--forest-deep);
}

.digest-body p { margin: 0 0 14px; }
.digest-body p:last-child { margin-bottom: 0; }
.digest-body strong { font-style: italic; font-weight: 500; color: var(--terra); }

.digest-gaps {
  margin-top: 18px;
  padding: 14px 16px;
  background: var(--paper-warm);
  border-radius: 4px;
  font-family: var(--serif);
  font-size: 13.5px;
  color: var(--forest-deep);
  line-height: 1.55;
}

.digest-gaps-title {
  font-family: var(--serif);
  font-style: italic;
  font-size: 13px;
  color: var(--terra);
  margin-bottom: 6px;
}

/* LEGEND */
.legend-zones {
  display: flex;
  gap: 14px;
  margin-top: 10px;
  padding: 10px 14px;
  background: var(--paper-ivory);
  border: 1px solid var(--stone-soft);
  border-radius: 4px;
  flex-wrap: wrap;
  font-size: 12px;
  font-family: var(--serif);
  color: var(--forest-deep);
}

.legend-zone {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.legend-swatch {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 1px solid rgba(46, 42, 31, 0.2);
}

/* BUTTONS */
.btn {
  background: transparent;
  border: 1.5px solid var(--ivy);
  color: var(--forest);
  border-radius: 999px;
  padding: 10px 22px;
  font-size: 14px;
  cursor: pointer;
  font-family: var(--serif);
  font-weight: 500;
  transition: all 0.15s;
}

.btn:hover { background: var(--ivy); color: var(--cream); }

.btn.primary { background: var(--terra); border-color: var(--terra); color: var(--cream); }
.btn.primary:hover { background: var(--terra-deep); border-color: var(--terra-deep); }

.btn.ghost { border-color: var(--stone); color: var(--ink-soft); }
.btn.ghost:hover { border-color: var(--ivy); background: transparent; color: var(--forest); }

/* FOOTER */
.footer {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 22px 32px;
  border-top: 1px solid var(--stone);
}

.footer .spacer { flex: 1; }

.step-name {
  font-family: var(--serif);
  font-style: italic;
  color: var(--ink-muted);
  font-size: 13px;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.step-content { animation: fadeUp 0.35s ease-out; }
.step-content > * { animation: fadeUp 0.5s ease-out both; }
.step-content > *:nth-child(1) { animation-delay: 0s; }
.step-content > *:nth-child(2) { animation-delay: 0.08s; }
.step-content > *:nth-child(3) { animation-delay: 0.16s; }
.step-content > *:nth-child(4) { animation-delay: 0.24s; }

/* Goal cards (step 5) */
.goals-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.goal-card {
  display: flex;
  gap: 12px;
  padding: 14px 16px;
  background: var(--paper-ivory);
  border: 1.5px solid var(--stone-soft);
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s;
}

.goal-card:hover {
  border-color: var(--ivy);
}

.goal-card.checked {
  border-color: var(--ivy);
  background: var(--paper);
}

/* Plot dashboard cards (step 7) */
.plot-dash-card:hover {
  border-color: var(--ivy) !important;
  transform: translateY(-1px);
  box-shadow: 0 2px 8px rgba(46, 42, 31, 0.08);
}

.clickable-plot {
  cursor: pointer;
}

.clickable-plot:hover rect {
  stroke-width: 3;
}

@media (max-width: 820px) {
  .map-layout, .analysis-grid { grid-template-columns: 1fr; }
  .content { padding: 20px; }
  .header, .footer { padding: 16px 20px; }
  h1 { font-size: 26px; }
  .goals-grid { grid-template-columns: 1fr; }
  .step-pills .step-pill:nth-child(n+5) { display: none; }
}
</style>
</head>
<body>

<div class="app">

  <header class="header">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 80 100">
        <ellipse cx="40" cy="96" rx="18" ry="2" fill="#8b6f47" opacity="0.3"/>
        <path d="M40 8 Q 20 42, 16 46 L 64 46 Q 60 42, 40 8 Z" fill="#b5552a"/>
        <ellipse cx="40" cy="47" rx="24" ry="2.5" fill="#8b3e1d"/>
        <circle cx="40" cy="10" r="3" fill="#f3e9c9"/>
        <ellipse cx="40" cy="52" rx="13" ry="10" fill="#e8c4a0"/>
        <path d="M24 49 Q 22 72, 40 76 Q 58 72, 56 49 Q 53 64, 40 66 Q 27 64, 24 49 Z" fill="#f3e9c9"/>
        <path d="M31 54 Q 40 57, 49 54 Q 43 59, 40 59 Q 37 59, 31 54 Z" fill="#f3e9c9"/>
        <circle cx="40" cy="53" r="3" fill="#d98e7e"/>
        <path d="M33 47 Q 35 48.5, 37 47 M 43 47 Q 45 48.5, 47 47" stroke="#2a4428" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <path d="M27 73 Q 25 92, 40 94 Q 55 92, 53 73 Z" fill="#556b3a"/>
        <rect x="29" y="86" width="22" height="2.8" fill="#2e2a1f"/>
        <path d="M28 79 L 20 83 M 52 79 L 60 83" stroke="#556b3a" stroke-width="3.5" stroke-linecap="round"/>
        <ellipse cx="34" cy="96" rx="5.5" ry="2.5" fill="#2e2a1f"/>
        <ellipse cx="46" cy="96" rx="5.5" ry="2.5" fill="#2e2a1f"/>
      </svg>
      <div>
        <div class="brand-name">Garden Gnome</div>
        <span class="brand-tag">your friendly gardener's friend</span>
      </div>
    </div>
    <div class="step-indicator">
      <span id="step-text"></span>
      <div class="step-pills" id="step-pills"></div>
    </div>
  </header>

  <main id="main" class="content"></main>

  <footer class="footer">
    <button class="btn ghost" id="back-btn">← Back</button>
    <div class="spacer"></div>
    <span class="step-name" id="step-name"></span>
    <div class="spacer"></div>
    <button class="btn primary" id="next-btn"></button>
  </footer>

</div>

<script>
(function() {
'use strict';

var state = { step: 1 };

var STEP_META = [
  { name: 'Your address', title: "Let's start with <em>your land</em>.", deck: "I'll pull up a satellite view and we can mark what's there. Takes about five minutes." },
  { name: 'Mark what I see', title: 'Help me <em>see clearly</em>.', deck: "Click a tool, then click the map to place it. Start with your house — I'll use it to figure out sun direction. Add trees, beds, and water sources as you go." },
  { name: 'Fill in gaps', title: "Things I <em>can't tell</em> from above.", deck: "A few quick things I can't pick up from the satellite image. Answer what you know, skip what you don't." },
  { name: 'My analysis', title: "Here's <em>what I see</em>.", deck: "My read on your property. Sun zones, microclimates, and what's working in your favor." },
  { name: 'Your goals', title: "What do you want to <em>grow?</em>", deck: "Pick everything you want on your property. I'll figure out if and where it all fits." },
  { name: 'My proposal', title: "Here's <em>my plan</em> for your place.", deck: "A proposed layout. Existing things are locked — new plots you can drag, resize, or swap out. Nothing is real until you say so." },
  { name: 'Your homestead', title: "Your <em>homestead</em>, at a glance.", deck: "This is home. Click any plot to tend it — I'll walk you through planting, watering, harvesting, everything." }
];

var CTAS = ['Pull up my property →', 'Fill in gaps →', "See what I've learned →", "Tell me what you want to grow →", 'See my proposed plan →', 'Accept and go to my homestead →', 'Start tending my plots →'];

// ============ STEP 1 ============
function renderStep1() {
  return '<div class="page-intro">' +
    '<div class="eyebrow">Part 1 of 7 · Your address</div>' +
    '<h1>' + STEP_META[0].title + '</h1>' +

    peach: '<svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="13" r="6" fill="#e89338"/><path d="M8 8 Q 10 6 12 7 Q 14 6 16 8" stroke="#556b3a" stroke-width="1.2" fill="none"/></svg>',
    tomato: '<svg viewBox="0 0 24 24" width="22" height="22"><path d="M8 6 L 12 8 L 16 6 L 15 9 L 9 9 Z" fill="#556b3a"/><circle cx="12" cy="13" r="5" fill="#b5552a"/></svg>',
    corn: '<svg viewBox="0 0 24 24" width="22" height="22"><path d="M10 4 Q 8 10 10 20 Q 12 22 14 20 Q 16 10 14 4 Q 12 2 10 4 Z" fill="#e8be4d"/><path d="M10 4 Q 7 8 8 12" stroke="#556b3a" stroke-width="1.2" fill="none"/><path d="M14 4 Q 17 8 16 12" stroke="#556b3a" stroke-width="1.2" fill="none"/></svg>',
    flower: '<svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="9" r="3" fill="#b5552a"/><circle cx="8" cy="7" r="2.5" fill="#d96b7a"/><circle cx="16" cy="7" r="2.5" fill="#d96b7a"/><circle cx="8" cy="12" r="2.5" fill="#e89338"/><circle cx="16" cy="12" r="2.5" fill="#e89338"/><circle cx="12" cy="9" r="1.5" fill="#c9a24a"/><line x1="12" y1="12" x2="12" y2="20" stroke="#556b3a" stroke-width="1.5"/></svg>'
  };
  var statusColor = { dormant: 'var(--ink-muted)', planning: 'var(--terra)', waiting: 'var(--moss)', active: 'var(--ivy)' };
  return '<div class="plot-dash-card" data-plot="' + id + '" style="background: var(--paper-ivory); border: 1px solid var(--stone-soft); border-radius: 6px; padding: 14px 16px; cursor: pointer; transition: all 0.15s;">' +
    '<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 6px;">' +
      '<div style="display: flex; align-items: center; gap: 8px;">' +
        iconMap[icon] +
        '<span style="font-family: var(--serif); font-weight: 500; font-size: 16px; color: var(--forest-deep);">' + name + '</span>' +
      '</div>' +
      '<span style="font-family: var(--serif); font-style: italic; font-size: 11px; color: ' + statusColor[statusType] + ';">' + statusType + '</span>' +
    '</div>' +
    '<div style="font-family: var(--serif); font-style: italic; font-size: 12.5px; color: var(--ink-muted); margin-bottom: 6px;">' + meta + '</div>' +
    '<div style="font-family: var(--serif); font-size: 13px; color: var(--forest-deep); padding-top: 8px; border-top: 1px dashed var(--stone-soft); display: flex; justify-content: space-between; align-items: center;">' +
      '<span>' + status + '</span>' +
      '<span style="font-family: var(--serif); font-style: italic; font-size: 12px; color: var(--terra);">tend →</span>' +
    '</div>' +
  '</div>';
}

var STEPS = [renderStep1, renderStep2, renderStep3, renderStep4, renderStep5, renderStep6, renderStep7];

function render() {
  try {
    var step = state.step;
    var totalSteps = 7;

    document.getElementById('step-text').textContent = step < 7 ? 'Setup step ' + step + ' of 7' : 'Home';

    var pills = '';
    for (var i = 1; i <= totalSteps; i++) {
      var cls = 'step-pill';
      if (i === step) cls += ' current';
      else if (i < step) cls += ' on';
      pills += '<span class="' + cls + '"></span>';
    }
    document.getElementById('step-pills').innerHTML = pills;

    var main = document.getElementById('main');
    main.innerHTML = '<div class="step-content">' + STEPS[step - 1]() + '</div>';

    document.getElementById('back-btn').style.visibility = step === 1 ? 'hidden' : 'visible';
    document.getElementById('next-btn').textContent = step === totalSteps ? 'Start tending →' : CTAS[step - 1];
    document.getElementById('step-name').textContent = STEP_META[step - 1].name;

    // Wire up goal card toggles on step 5
    if (step === 5) {
      main.querySelectorAll('.goal-card').forEach(function(el) {
        el.addEventListener('click', function(e) {
          if (e.target.tagName !== 'INPUT') {
            var cb = el.querySelector('input[type=checkbox]');
            cb.checked = !cb.checked;
          }
          el.classList.toggle('checked');
        });
      });
    }

    // Wire up plot cards on step 7
    if (step === 7) {
      main.querySelectorAll('.plot-dash-card').forEach(function(el) {
        el.addEventListener('click', function() {
          var plot = el.getAttribute('data-plot');
          alert('This would open the detailed planning flow for: ' + plot + '\n\n(The 5-step kitchen garden flow we already designed would live here, tailored to each plot type.)');
        });
      });
    }

    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (err) {
    document.getElementById('main').innerHTML = '<div style="padding: 40px; color: #8b3e1d; font-family: monospace;">Error: ' + (err.message || err) + '</div>';
    console.error(err);
  }
}

document.getElementById('next-btn').addEventListener('click', function() {
  if (state.step < 7) { state.step++; render(); }
  else { alert('You would now drill into individual plots to plan them in detail.'); }
});

document.getElementById('back-btn').addEventListener('click', function() {
  if (state.step > 1) { state.step--; render(); }
});

render();
})();
</script>
