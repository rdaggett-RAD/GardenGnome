services:
  - type: web
    name: garden-gnome
    runtime: node
    plan: starter
    region: oregon
    branch: main

    # Build & start
    buildCommand: npm install && npm run build
    startCommand: npm start

    # Health check
    healthCheckPath: /

    # Environment variables — set values in Render dashboard, NOT in this file
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: NOAA_API_TOKEN
        sync: false
      - key: PERENUAL_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
